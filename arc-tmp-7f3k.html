<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Скачать вопросы ARC</title>
<style>
body{font:16px system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px;background:#14102a;color:#f3efe6}
button{font:inherit;font-weight:600;padding:14px 20px;border-radius:12px;border:0;background:#ffc93c;color:#1b1033;width:100%;cursor:pointer}
button:disabled{opacity:.5}
#log{margin-top:16px;white-space:pre-wrap;color:#c9c3d9;font-size:14px}
</style></head><body>
<h1>Вопросы ARC для школьников</h1>
<p>Нажмите кнопку. Страница скачает научные школьные вопросы AI2 ARC (лицензия CC BY-SA 4.0), отберёт короткие и сохранит файл <b>arc.json</b>. Этот файл пришлите мне в чат.</p>
<button id="go">Скачать</button>
<div id="log"></div>
<script>
const log=t=>document.getElementById("log").textContent=t;
const B="https://datasets-server.huggingface.co/rows?dataset=allenai/ai2_arc";
async function page(cfg,split,off){
  const r=await fetch(`${B}&config=${cfg}&split=${split}&offset=${off}&length=100`);
  if(!r.ok)throw new Error(cfg+" "+split+" "+off+": HTTP "+r.status);
  return r.json();
}
document.getElementById("go").onclick=async e=>{
  e.target.disabled=true;const out=[];
  try{
    for(const cfg of ["ARC-Easy","ARC-Challenge"]){
      for(const split of ["train","validation","test"]){
        let off=0,total=1;
        while(off<total){
          const j=await page(cfg,split,off);total=j.num_rows_total;
          for(const x of j.rows){
            const q=x.row;
            if(!q.choices||q.choices.text.length!==4)continue;
            if(q.question.length>140||q.choices.text.some(t=>t.length>45))continue;
            const k=q.choices.label.indexOf(q.answerKey);if(k<0)continue;
            out.push({q:q.question,a:q.choices.text[k],w:q.choices.text.filter((_,i)=>i!==k),lvl:cfg==="ARC-Easy"?"e":"h"});
          }
          off+=100;log(`${cfg} ${split}: ${Math.min(off,total)} из ${total}\nОтобрано: ${out.length}`);
        }
      }
    }
    const blob=new Blob([JSON.stringify(out)],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="arc.json";a.click();
    log(`Готово: ${out.length} вопросов. Файл arc.json сохранён, пришлите его мне.`);
  }catch(err){log("Ошибка: "+err.message+"\nПопробуйте ещё раз или пришлите этот текст мне.");e.target.disabled=false}
};
</script></body></html>
